name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install triggerkit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . eventio pytest

      # dl1-data-handler (the hexagonal mapping of the camera) declares Python >= 3.12 but its code runs on 3.10 and 3.11:
      # it is installed without its requirement check. Its other dependencies are already installed above.
      - name: Install dl1-data-handler
        run: python -m pip install --no-deps --ignore-requires-python "git+https://github.com/cta-observatory/dl1-data-handler.git@v0.14.12"

      - name: Run the tests
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest -q --deselect tests/test_viewer_app.py

  docs:
    name: documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r docs/requirements.txt numpy h5py scipy matplotlib astropy hdf5plugin
      - run: PYTHONPATH=src sphinx-build -b html docs docs/_build/html
