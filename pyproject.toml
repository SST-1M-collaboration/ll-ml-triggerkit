[tool.poetry]
name = "ll-ml-triggerkit"
version = "0.1.0"
description = "Trainable low-level ML trigger chains for Cherenkov cameras (SST-1M / DigiCam)."
authors = ["Tanguy Dietrich"]
license = "MIT"
readme = "README.md"
packages = [{ include = "triggerkit", from = "src" }]

[tool.poetry.dependencies]
# 3.12: dl1-data-handler (hexagonal mapping of the whole camera) and recent ctapipe need it.
python = ">=3.12,<3.14"
numpy = ">=2.1"
scipy = "*"
scikit-learn = "*"
h5py = "*"
hdf5plugin = "*"
# pytables and eventio: the converters (triggerkit-convert, triggerkit-merge) write with pytables and read simtel files with eventio; ctapipe brings both, they are declared because the code imports them.
tables = "*"
eventio = "*"
matplotlib = "*"
astropy = "*"
setproctitle = "*"
# The versions the quantized models and their hls4ml export were validated with (qat5-qat8, qat7 ring).
tensorflow = "~2.20.0"
keras = "~3.12.0"
# < 0.33: ctapipe 0.33 reorganised its containers (DL1CameraContainer, R1CameraContainer and event.r0.tel[...] are gone): the simulation converter is written for 0.26 to 0.32 and has not been ported.
ctapipe = ">=0.29,<0.33"
# Hexagonal mapping of the camera (HexagdlyMapper): the one source of truth, also used by CTLearn.
# Not on PyPI beyond 0.14.6; ctlearn 0.11 needs >= 0.14.12.
dl1-data-handler = { git = "https://github.com/cta-observatory/dl1-data-handler.git", tag = "v0.14.12" }
# Optional, see [tool.poetry.extras]
keras-hexagdly = { version = ">=0.7.0,<0.8", optional = true }
hgq2 = { version = "0.1.9", optional = true }
hls4ml = { version = "1.3.0", optional = true }
pyqtgraph = { version = ">=0.13", optional = true }
PyQt5 = { version = ">=5.15", optional = true }
# Real SST-1M data (*.fits.fz): triggerkit-convert on a real file, triggerkit-merge, tests/test_convert_real.py. On the DAQ side it is the sst1mpipe environment that has it.
protozfits = { version = "*", optional = true }

[tool.poetry.scripts]
triggerkit-convert = "triggerkit.tools.convert:main"
triggerkit-viewer = "triggerkit.viewer.app:main"
triggerkit-merge = "triggerkit.tools.merge:main"

[tool.poetry.extras]
# Hex CNN bodies (models/hexcnn.py, SequentialBody hex layers).
hexcnn = ["keras-hexagdly"]
# Fully quantized (HGQ2) models and their hls4ml export; needs the hex layers too.
qat = ["keras-hexagdly", "hgq2", "hls4ml"]
# sim_telarray viewer (triggerkit-viewer, triggerkit.viewer): the GUI (the reading of simtel files is eventio, a core dependency).
viewer = ["pyqtgraph", "PyQt5"]
# Real data files (*.fits.fz): the real-data converter, triggerkit-merge and their tests.
real = ["protozfits"]

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-filter-subpackage (pulled in by astropy/ctapipe test deps) breaks on pytest 9
addopts = "-p no:pytest_filter_subpackage"
# third-party deprecation noise (matplotlib's mathtext via pyparsing) from rendering the report
filterwarnings = [
    "ignore::DeprecationWarning:pyparsing.*",
    "ignore::DeprecationWarning:matplotlib.*",
]
